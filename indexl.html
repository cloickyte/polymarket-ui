<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket Quick Order</title>
    <!-- Include Telegram WebApp JS Script SDK -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #12141c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #181a24;
            border-radius: 12px;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid #232635;
        }
        .header {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        .direction-banner {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 24px;
            box-sizing: border-box;
        }
        .banner-up { background-color: #057a33; color: #fff; }
        .banner-down { background-color: #7a1515; color: #fff; }
        
        .sub-label {
            font-size: 12px;
            color: #8a93a6;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .button-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .bet-button {
            flex: 1;
            background: #12141c;
            border: 1px solid #2d3142;
            border-radius: 10px;
            padding: 14px 8px;
            color: white;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .bet-button:active {
            transform: scale(0.96);
            background: #1f2231;
        }
        .bet-val {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .win-val {
            font-size: 11px;
            color: #00c853;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>SOL Up or Down 15m</span>
        <span style="color: #8a93a6; font-size: 13px;">1-Tap ▾</span>
    </div>

    <!-- Direction block mirrors the green/red top visual indicator -->
    <div id="directionBlock" class="direction-banner">Loading Alert...</div>

    <div class="sub-label">One-tap buy options</div>
    
    <!-- Exact layout for the 1, 3, and 5 dollar cards inside the grid layout -->
    <div class="button-row">
        <div class="bet-button" onclick="placeOrder(1, 1.45)">
            <div class="bet-val">$1</div>
            <div class="win-val">win $1.45</div>
        </div>
        <div class="bet-button" onclick="placeOrder(3, 4.35)">
            <div class="bet-val">$3</div>
            <div class="win-val">win $4.35</div>
        </div>
        <div class="bet-button" onclick="placeOrder(5, 7.25)">
            <div class="bet-val">$5</div>
            <div class="win-val">win $7.25</div>
        </div>
    </div>
</div>

<script>
    // Extract variables passed from the main python alert script
    const urlParams = new URLSearchParams(window.location.search);
    const direction = urlParams.get('dir') || 'UP';
    const triggerPrice = urlParams.get('price') || '0.00';

    const banner = document.getElementById('directionBlock');
    if(direction.toUpperCase() === 'UP') {
        banner.innerText = 'Up ' + triggerPrice + '¢';
        banner.className = 'direction-banner banner-up';
    } else {
        banner.innerText = 'Down ' + triggerPrice + '¢';
        banner.className = 'direction-banner banner-down';
    }

    // Initialize Telegram SDK
    const tg = window.Telegram.WebApp;
    tg.expand(); // Forces window to pop open smoothly into comprehensive view

    function placeOrder(amount, expectedWin) {
        // Send data directly back into your python backend infrastructure
        const orderPayload = {
            action: "EXECUTE_POLYMARKET_TRADE",
            side: direction,
            stake: amount,
            payout: expectedWin
        };
        
        tg.sendData(JSON.stringify(orderPayload)); // Sends payload and cleanly exits screen
        tg.close();
    }
</script>
</body>
</html>
